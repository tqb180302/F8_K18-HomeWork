<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h1>Danh sách Post</h1>

<button onclick="createPost()">Thêm bài viết</button>

<ul id="postList"></ul>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script>
    const API = "https://dummyjson.com/posts";
    let posts = [];

    async function fetchPosts() {
        try {
            const res = await axios.get(API);
            posts = res.data.posts;

            renderPosts();
        } catch (error) {
            alert("Lỗi khi lấy danh sách bài viết, vui lòng thử lại!");
            console.log(error);
        }
    }

    function renderPosts() {
        const list = document.getElementById("postList");
        list.innerHTML = "";

        posts.forEach(post => {
            const li = document.createElement("li");

            li.innerHTML = `
                    ${post.title}
                    <button onclick="goDetail(${post.id})">Chi tiết</button>
                    <button onclick="editPost(${post.id})">Sửa</button>
                    <button onclick="deletePost(${post.id})">Xoá</button>
                `;

            list.appendChild(li);
        });
    }

    function goDetail(id) {
        window.location.href = `detail.html?id=${id}`;
    }

    async function createPost() {
        const title = prompt("Nhập tiêu đề bài viết:");

        if (!title) return;

        try {
            const res = await axios.post(API + "/add", {
                title: title,
                userId: 1
            });


            posts.unshift(res.data);
            renderPosts();
        } catch (error) {
            alert("Lỗi khi thêm mới bài viết, vui lòng thử lại!");
            console.log(error);
        }
    }

    async function editPost(id) {
        const post = posts.find(p => p.id === id);
        if (!post) return;

        const newTitle = prompt("Sửa tiêu đề:", post.title);

        if (!newTitle) return;

        try {
            const res = await axios.put(`${API}/${id}`, {
                title: newTitle
            });


            const index = posts.findIndex(p => p.id === id);
            if (index !== -1) {
                posts[index] = res.data;
                renderPosts();
            }
        } catch (error) {
            alert("Lỗi khi cập nhật bài viết, vui lòng thử lại!");
            console.log(error);
        }
    }

    async function deletePost(id) {
        const confirmDelete = confirm("Bạn chắc chắn muốn xoá?");

        if (!confirmDelete) return;

        try {
            await axios.delete(`${API}/${id}`);


            posts = posts.filter(p => p.id !== id);
            renderPosts();
        } catch (error) {
            alert("Lỗi khi xoá bài viết, vui lòng thử lại!");
            console.log(error);
        }
    }

    fetchPosts();
</script>
</body>
</html>
